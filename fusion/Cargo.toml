[package]
name = "moonz-fusion"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "moonz_fusion"
crate-type = ["cdylib", "lib"]

[workspace]

[workspace.metadata.cli]
solana = "2.3.13"

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "=2.3.0"
solana-curve25519 = "=2.3.13"
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
borsh = { version = "=1.5.7", features = ["derive"] }
bincode = "=1.3.3"
solana-security-txt = "=1.1.3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
